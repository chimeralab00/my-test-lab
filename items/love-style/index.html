<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恋愛コミュニケーション傾向診断｜Chimera Lab</title>
  <meta name="description" content="全7問であなたの親しい人との距離感や恋愛コミュニケーションの癖を4つのタイプから可視化します。">

  <!-- OGP基本設定 -->
  <meta property="og:title" content="恋愛コミュニケーション傾向診断｜Chimera Lab">
  <meta property="og:description" content="全7問であなたの恋愛距離感・コミュ傾向をチェック！">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://chimeralab00.github.io/my-test-lab/tests/love-style/">
  <meta name="twitter:card" content="summary">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="../../assets/common.css">
</head>
<body>
  <main class="container">
    <section id="quiz-card">
      <!-- 共通JSが左上に「← トップへ」ボタンを自動生成 -->
      <div id="test-nav-header"></div>

      <!-- ① 診断の説明（イントロ）画面 -->
      <div id="intro-view">
        <span class="intro-badge">DIAGNOSIS</span>
        <h1 class="intro-title">恋愛コミュニケーション傾向診断</h1>
        <p class="intro-desc">
          親しい人との心地よい距離感や、無意識に出てしまうコミュニケーションの癖を全7問で分析。<br>
          あなたが本当に求めているパートナーシップのスタンスを4つのタイプから可視化します。
        </p>

        <div class="intro-meta-box">
          <div class="intro-meta-item">
            <span class="meta-label">設問数</span>
            <span class="meta-val">全 7 問</span>
          </div>
          <div class="intro-meta-item">
            <span class="meta-label">目安時間</span>
            <span class="meta-val">約 1〜2 分</span>
          </div>
        </div>

        <button id="start-btn" class="start-btn-primary">診断をはじめる</button>
      </div>

      <!-- ② 診断の設問画面（初期状態は非表示） -->
      <div id="quiz-view" style="display: none;">
        <div class="card-header">
          <p id="progress" class="progress-text">質問 1 / 7</p>
          <h1 id="question-text" class="question-text">読み込み中…</h1>
        </div>
        <div id="options-container" class="options-group">
          <!-- script.jsが動的に生成 -->
        </div>
      </div>
    </section>
  </main>

  <!-- 共通JS ＆ 診断ロジック -->
  <script src="../../assets/common.js"></script>
  <script src="script.js"></script>
</body>
</html>
