<html lang="ja">
<head>

    gtag('config', 'G-7MNC1PLLZ7');

    gtag('config', 'G-FW7R85YTVX');

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chimera Test Lab｜自己理解・思考特性 診断ポータル</title>
  <meta name="description" content="無意識の思考パターン、デジタル依存度、対人関係の傾向を可視化する無料の自己診断ポータルサイト。">

  <!-- OGP基本設定 -->
  <meta property="og:title" content="Chimera Test Lab｜自己理解・思考特性 診断ポータル">
  <meta property="og:description" content="無意識の思考パターンや生活習慣を可視化する無料の自己診断ポータル。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tests.hiddenchimera.com/">
  <meta name="twitter:card" content="summary">

  <!-- 共通CSS -->
  <link rel="stylesheet" href="assets/common.css">

  <style>
    /* トップページ専用の微調整 */
    .portal-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }
    .portal-item {
      display: block;
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .portal-item:hover {
        background-color: #eef2ff;
        border-color: #818cf8;
        transform: translateY(-2px);
      }
    }
    .portal-item-badge {
      display: inline-block;
      font-size: 0.7rem;
      font-weight: 700;
      color: #4f46e5;
      margin-bottom: 6px;
    }
    .portal-item-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .portal-item-desc {
      font-size: 0.85rem;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 10px;
    }
    .portal-item-meta {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: 600;
    }
    .portal-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.78rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <main class="container">
    <section id="quiz-card">
      <div id="intro-view">
        <span class="intro-badge">PORTAL</span>
        <h1 class="intro-title">Chimera Test Lab</h1>
        <p class="intro-desc" style="text-align: center;">
          無意識の思考パターン、デジタル依存度、対人関係の傾向を可視化する診断ポータルサイトです。
        </p>

        <!-- items.json から動的に展開 -->
        <div id="portal-list" class="portal-list"></div>

        <div class="portal-footer">
          &copy; Hidden Chimera All Rights Reserved.
        </div>
      </div>
    </section>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const container = document.getElementById('portal-list');

      try {
        const response = await fetch('./items.json');
        if (!response.ok) throw new Error('items.json の取得に失敗しました');

        const items = await response.json();

        container.innerHTML = items.map(item => {
          // badge が空文字でない場合のみ表示
          const badgeHtml = item.badge 
            ? `<span class="portal-item-badge">${item.badge}</span>` 
            : '';

          return `
            <a href="items/${item.id}/" class="portal-item">
              ${badgeHtml}
              <div class="portal-item-title">${item.title}</div>
              <div class="portal-item-desc">${item.description}</div>
            </a>
          `;
        }).join('');

      } catch (error) {
        console.error(error);
        container.innerHTML = '<p style="color: #94a3b8; text-align: center; font-size: 0.85rem;">診断一覧の読み込みに失敗しました。</p>';
      }
    });
  </script>
</body>
</html>
